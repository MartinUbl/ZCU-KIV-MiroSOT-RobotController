; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f103c8]
platform = ststm32
#board = nucleo_f401re
board = bluepill_f103c8
framework = stm32cube
debug_tool = stlink
upload_protocol = stlink

upload_flags = -c set CPUTAPID 0x2ba01477

monitor_port = COM9
monitor_speed = 9600
